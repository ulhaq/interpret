name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Backend - lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: "3.15"

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint (ty + ruff + import-linter)
        run: uv run poe check

      - name: API schemas match the code
        run: uv run poe openapi && git diff --exit-code openapi.json openapi.internal.json

      - name: Migrations match models
        env:
          DB_CONNECTION: postgresql+psycopg://postgres:postgres@localhost:5432/app
        run: uv run alembic upgrade head && uv run alembic check

      - name: Test
        env:
          APP_SECRET: ci-test-secret-not-for-production
          DB_CONNECTION: postgresql+psycopg://postgres:postgres@localhost:5432/app
        run: uv run poe test

      # The foundation and the product must work without the optional modules:
      # remove them from this throwaway checkout for good (as a user would,
      # docs/adding-a-domain-module.md) and check everything again - lint,
      # the migration chain on a fresh database, and the remaining tests.
      - name: Without optional modules - remove them
        run: |
          uv run python scripts/remove_module.py billing
          uv run python scripts/remove_module.py marketing
          uv run poe fix

      - name: Without optional modules - lint, migrate, test
        env:
          APP_SECRET: ci-test-secret-not-for-production
          DB_CONNECTION: postgresql+psycopg://postgres:postgres@localhost:5432/app_without_modules
        run: |
          uv run poe check
          uv run python -c "from sqlalchemy import create_engine, text; \
            e = create_engine('postgresql+psycopg://postgres:postgres@localhost:5432/app', \
            isolation_level='AUTOCOMMIT'); \
            e.connect().execute(text('CREATE DATABASE app_without_modules'))"
          uv run alembic upgrade head && uv run alembic check
          uv run poe test

  frontend:
    name: Frontend - typecheck & lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: API types match the schema
        run: npm run gen:api && git diff --exit-code src/api-schema.ts

      # Before type-checking: the build generates the route, component and
      # auto-import types (src/*.d.ts, gitignored) that the type-check reads.
      - name: Build
        run: npm run build

      - name: Type-check
        run: npm run typecheck

      # Not `npm run lint`: that runs eslint --fix, which would pass by
      # rewriting the checkout instead of failing.
      - name: Lint
        run: npx eslint .

      - name: Component tests
        run: npm test

      - name: Formatting
        run: npm run format:check

      # The app must work without the billing module: remove it from this
      # throwaway checkout (as a user would) and check everything again.
      - name: Without billing - remove the module
        run: node scripts/remove-billing.mjs

      - name: Without billing - build, type-check, lint, test
        run: npm run build && npm run typecheck && npx eslint . && npm test

  site:
    name: Site - check & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run check

      - name: Build
        run: npm run build

  build-and-push:
    name: Build & push images
    needs: [backend, frontend, site]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/backend:latest
            ghcr.io/${{ github.repository }}/backend:${{ github.sha }}

      - name: Write frontend env
        env:
          FRONTEND_ENV: ${{ secrets.FRONTEND_ENV }}
        run: printf '%s\n' "$FRONTEND_ENV" > frontend/.env

      - name: Build and push frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/frontend:latest
            ghcr.io/${{ github.repository }}/frontend:${{ github.sha }}

      - name: Write site env
        env:
          SITE_ENV: ${{ secrets.SITE_ENV }}
        run: printf '%s\n' "$SITE_ENV" > site/.env

      - name: Build and push site
        uses: docker/build-push-action@v7
        with:
          context: ./site
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/site:latest
            ghcr.io/${{ github.repository }}/site:${{ github.sha }}

  deploy:
    name: Deploy to Hetzner
    needs: [build-and-push]
    runs-on: ubuntu-latest
    # Queue, never overlap: a slower older deploy finishing last would roll
    # production back to its SHA.
    concurrency:
      group: deploy
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v6

      - name: Copy scripts and compose files to server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          source: scripts/,docker-compose.yml,docker-compose.observability.yml,observability/
          target: /opt/app/

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          BACKEND_IMAGE: ghcr.io/${{ github.repository }}/backend:${{ github.sha }}
          FRONTEND_IMAGE: ghcr.io/${{ github.repository }}/frontend:${{ github.sha }}
          SITE_IMAGE: ghcr.io/${{ github.repository }}/site:${{ github.sha }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          OBSERVABILITY_ENV: ${{ secrets.OBSERVABILITY_ENV }}
          BACKEND_ENV: ${{ secrets.BACKEND_ENV }}
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          envs: BACKEND_IMAGE,FRONTEND_IMAGE,SITE_IMAGE,GHCR_TOKEN,GITHUB_ACTOR,OBSERVABILITY_ENV,BACKEND_ENV
          script: |
            set -e
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
            printf '%s\n' "$BACKEND_ENV" > /opt/app/.env
            echo "BACKEND_IMAGE=$BACKEND_IMAGE" >> /opt/app/.env
            echo "FRONTEND_IMAGE=$FRONTEND_IMAGE" >> /opt/app/.env
            echo "SITE_IMAGE=$SITE_IMAGE" >> /opt/app/.env
            cd /opt/app
            docker compose pull
            # Migrate with the new image while the old containers still serve.
            # New code may map columns the live schema lacks, so the schema has
            # to be ahead of the containers, never behind. Fails the deploy if
            # the migration fails - old containers keep running, untouched.
            # Then sync permissions: new ones reach every Owner role.
            docker compose run --rm backend sh -c \
              "alembic upgrade head && python -m src.sync_permissions"
            docker compose up -d --remove-orphans
            # Same stale-mount issue for the agent config; restart only if the
            # observability profile is on (naming the service would start it).
            if [ -n "$(docker compose ps -q alloy)" ]; then docker compose restart alloy; fi
            # Monitoring stack on the same server, only when the OBSERVABILITY_ENV
            # secret is set. Recreated every deploy: the copy replaces the config
            # files, and single-file bind mounts keep pointing at the old ones.
            if [ -n "$OBSERVABILITY_ENV" ]; then
              printf '%s\n' "$OBSERVABILITY_ENV" > observability/.env
              docker compose -f docker-compose.observability.yml -p observability \
                --env-file observability/.env up -d --force-recreate --remove-orphans
            fi
            # Each deploy pulls new SHA-tagged images; drop unused ones older
            # than 7 days so the disk doesn't fill. Images in use are never
            # removed, and older SHAs can be re-pulled from GHCR for a rollback.
            docker image prune -af --filter "until=168h" || true
