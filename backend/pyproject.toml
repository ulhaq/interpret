[project]
name = "saas-boilerplate"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.143.0",
    "alembic>=1.20.0",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "sqlalchemy[asyncio]>=2.1.4",
    "uvicorn>=0.54.0",
    "psycopg-binary>=3.3.6",
    "psycopg>=3.3.6",
    "python-dateutil>=2.9.0.post0",
    "itsdangerous>=2.2.0",
    "argon2-cffi>=25.1.0",
    "slowapi>=0.1.10",
    "stripe>=16.0.0",
    "disposable-email-domains>=0.0.276",
    "httpx>=0.28.1",
    "structlog>=26.1.0",
    "opentelemetry-sdk>=1.45.1",
    "opentelemetry-exporter-otlp-proto-http>=1.45.1",
    "opentelemetry-instrumentation-sqlalchemy>=0.65b0",
    "opentelemetry-instrumentation-httpx>=0.65b0",
    "opentelemetry-instrumentation-requests>=0.65b0",
    "pyotp>=2.10.0",
    "cryptography>=50.0.2",
    "redis>=6",
]

[dependency-groups]
dev = [
    "aiosmtpd>=1.4.6",
    "import-linter>=2.15",
    "locust>=2.46.7",
    "poethepoet>=0.48.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.16.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.10",
    "ty>=0.0.85",
]

[tool.poe]
# Paths every static check covers.
env = { CHECK_PATHS = "src tests scripts worker.py generate_openapi.py locustfile.py" }

[tool.poe.tasks]
dev = { cmd = "fastapi dev src/main.py --host 0.0.0.0 --port 8000", help = "Run the API dev server on :8000" }
openapi = { cmd = "python generate_openapi.py", help = "Regenerate openapi.json and openapi.internal.json" }

# Static checks - `check` runs all checks and fails if any fail; `fix` applies automatic fixes and formats the code.
[tool.poe.tasks.check]
help = "Run every static check: types, lint, formatting, import contracts"
sequence = ["check:types", "check:lint", "check:format", "check:imports"]
ignore_fail = "return_non_zero"

[tool.poe.tasks."check:types"]
cmd = "ty check ${CHECK_PATHS}"
help = "Type check with ty"

[tool.poe.tasks."check:lint"]
cmd = "ruff check ${CHECK_PATHS}"
help = "Lint with ruff"

[tool.poe.tasks."check:format"]
cmd = "ruff format ${CHECK_PATHS} --check"
help = "Check formatting without changing files"

[tool.poe.tasks."check:imports"]
cmd = "lint-imports"
help = "Check the import-linter boundary and layer contracts"

[tool.poe.tasks.fix]
help = "Autofix lint issues, then format the code"
sequence = ["fix:lint", "fix:format"]
ignore_fail = "return_non_zero"

[tool.poe.tasks."fix:lint"]
cmd = "ruff check ${CHECK_PATHS} --fix"
help = "Autofix lint issues with ruff"

[tool.poe.tasks."fix:format"]
cmd = "ruff format ${CHECK_PATHS}"
help = "Format the code with ruff"

# Tests (PostgreSQL required, see README).
[tool.poe.tasks.test]
cmd = "pytest ./tests -n auto"
help = "Run the test suite in parallel"

[tool.poe.tasks."test-foundation-only"]
cmd = "pytest ./tests -n auto"
env = { TEST_WITHOUT_MODULES = "optional" }
help = "Run the suite without the optional modules (billing, marketing)"

[tool.poe.tasks."test-cov"]
cmd = "pytest ./tests -n auto --cov=src --cov-report=term-missing --cov-report=html:htmlcov"
help = "Run the suite with a coverage report (terminal + htmlcov/)"

[tool.ruff]
exclude = ["src/foundation/templates"]

[tool.ruff.lint]
select = [
    # Pycodestyle, pyflakes, imports, naming, modern syntax
    "E",
    "W",
    "F",
    "I",
    "N",
    "A",
    "UP",
    "FA",
    "ICN",
    "INT",
    "TID",

    # Bugs and correctness
    "B",
    "BLE",
    "RUF",
    "PL",
    "C90",
    "TRY",
    "LOG",
    "G",
    "ASYNC",
    "DTZ",
    "PGH",
    "YTT",
    "AIR",
    "FAST",

    # Design: arguments, private access, slots
    "ARG",
    "FBT",
    "SLF",
    "SLOT",

    # Simplification and style
    "C4",
    "COM",
    "SIM",
    "RET",
    "PIE",
    "PERF",
    "FURB",
    "PTH",
    "FLY",
    "ISC",
    "Q",
    "RSE",

    # Typing and docs
    "ANN",
    "PYI",
    "TC004",
    "TC005",
    "TC007",
    "TC010",
    "D419",

    # Security, tests and tooling hygiene
    "S",
    "PT",
    "T10",
    "EXE",

    # TODO/FIXME comments
    "FIX",
    "TD",
]
ignore = ["ANN401", "COM812"]

[tool.ruff.lint.pylint]
max-args = 7
max-branches = 15

[tool.ruff.lint.flake8-annotations]
mypy-init-return = true

[tool.ruff.lint.per-file-ignores]
"*/*.py" = ["TRY003"]
"tests/**" = ["ANN", "PL", "SLF", "S101", "S105", "S106", "S107"]
"src/foundation/enums.py" = ["S105"]

[tool.ty.src]
exclude = ["src/foundation/templates"]

[tool.coverage.run]
source = ["src"]
omit = ["src/foundation/templates/*"]
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "@(abc\\.)?abstractmethod",
]

[tool.importlinter]
root_packages = ["src"]

[[tool.importlinter.contracts]]
name = "Foundation must not import its modules or the product domain"
type = "forbidden"
source_modules = ["src.foundation"]
forbidden_modules = ["src.billing", "src.marketing", "src.interpret"]

# Billing and marketing are optional foundation modules: none depends on another
# or on the product, and the product reaches them only through the foundation
# (entitlements, hooks) - so each can be removed. If your product must import
# one directly, narrow this contract.
[[tool.importlinter.contracts]]
name = "Optional modules and the product are independent of each other"
type = "independence"
modules = ["src.billing", "src.marketing", "src.interpret"]

# Each layer may import the layers below it, never the ones above. Applied to
# the foundation, billing and the product package; `provider` (an external
# service adapter) exists in billing (payments) and interpret (speech and
# translation). Keep `src.interpret` pointed at your product package when you
# rename it.
[[tool.importlinter.contracts]]
name = "Layers: routers > services > provider > repositories > models | schemas"
type = "layers"
containers = ["src.foundation", "src.billing", "src.marketing", "src.interpret"]
layers = [
    "routers",
    "services",
    "(provider)",
    "repositories",
    "models | schemas",
]

[[tool.importlinter.contracts]]
name = "Routers reach data only through services"
type = "forbidden"
source_modules = [
    "src.foundation.routers",
    "src.billing.routers",
    "src.marketing.routers",
    "src.interpret.routers",
]
forbidden_modules = [
    "src.foundation.repositories",
    "src.foundation.models",
    "src.billing.repositories",
    "src.billing.models",
    "src.marketing.repositories",
    "src.marketing.models",
    "src.interpret.repositories",
    "src.interpret.models",
]
# Routers -> services -> repositories is the intended path; only direct
# imports are forbidden.
allow_indirect_imports = true

# `core` is the foundation every layer builds on (config, database, errors,
# logging, telemetry, hooks, entitlements), so it must not import any of them.
[[tool.importlinter.contracts]]
name = "Core does not import the layers built on it"
type = "forbidden"
source_modules = ["src.foundation.core"]
forbidden_modules = [
    "src.foundation.routers",
    "src.foundation.services",
    "src.foundation.repositories",
    "src.foundation.models",
    "src.foundation.schemas",
]
